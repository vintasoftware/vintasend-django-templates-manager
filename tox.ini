[tox]
requires =
    tox>=4
envlist =
    # Django official Python support
    # Source: https://docs.djangoproject.com/en/6.0/faq/install/#what-python-version-can-i-use-with-django
    py312-{django42,django50,django51,django52,django60}
    py313-{django51,django52,django60}
    py314-{django60}
# Each CI matrix job installs only its own Python, so the other envs have no interpreter.
# Skip them instead of failing -- every version is still exercised by its own matrix job.
# Set explicitly rather than relying on the legacy-command default, which changed between
# tox 4.55 (skipped) and 4.58 (failed).
skip_missing_interpreters = true

[gh]
python =
    3.12 = py312-{django42,django50,django51,django52,django60}
    3.13 = py313-{django51,django52,django60}
    3.14 = py314-{django60}

[testenv]
description = run tests
basepython =
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    poetry
commands_pre =
    # `poetry install` resolves Django from poetry.lock, which pins a single version.
    # The factor pin therefore has to be installed AFTER it -- installing it first
    # (via `deps`) means poetry silently replaces it and every env tests the locked
    # version instead of the one named in the env.
    poetry install --with dev
    django42: python -m pip install "Django>=4.2,<4.3"
    django50: python -m pip install "Django>=5.0,<5.1"
    django51: python -m pip install "Django>=5.1,<5.2"
    django52: python -m pip install "Django>=5.2,<5.3"
    django60: python -m pip install "Django>=6.0,<6.1"
commands =
    poetry run pytest -n auto --cov vintasend_django_templates_manager --cov-report=xml:coverage-{envname}.xml {posargs}
